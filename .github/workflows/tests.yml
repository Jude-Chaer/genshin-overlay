# Builds the app and the tests and runs the tests, on every push to main and
# on every pull request.

name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/vcpkg

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild genshin-overlay.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Run the tests
        shell: pwsh
        run: build\Release\tests.exe
